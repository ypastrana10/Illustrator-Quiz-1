<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illustrator Quiz 1 — Foundations</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui,Arial,sans-serif;background:#eef3fa;color:#142b47;margin:0;padding:16px}.wrap{max-width:820px;margin:20px auto;padding:26px;background:#fff;border-radius:14px;box-shadow:0 5px 22px #b5c3d3}h1{color:#183e75}fieldset{border:1px solid #c8d6e7;border-radius:9px;margin:18px 0;padding:18px}legend{font-weight:700;line-height:1.5}label{display:block;padding:10px;margin:5px 0;border-radius:6px;cursor:pointer;border:1px solid transparent}label:hover{background:#f0f5ff}label:has(input:checked){border-color:#4a8fc7;background:#eff7ff}button{background:#1b4c91;color:white;border:0;padding:12px 22px;border-radius:8px;font-size:16px;cursor:pointer;margin:5px 7px 5px 0}button.secondary{background:#e3eaf4;color:#173d6d}.good{background:#e1f6e6!important;border-color:#27814b!important}.bad{background:#ffe5e5!important;border-color:#c54a4a!important}#result{font-size:20px;font-weight:bold;padding:15px 0}#notice{color:#9c3b22;font-weight:600}#progress{color:#53677e;font-weight:600}.actions{margin:22px 0}@media(max-width:550px){.wrap{padding:16px;margin:0}}@media print{button,.actions{display:none}body{background:white}.wrap{box-shadow:none}}
</style></head><body><main class="wrap"><h1>Quiz 1: Illustrator Foundations • Episodes 1–4</h1><p>Gareth David Studio • Illustrator beginner course • 15 questions • Select one answer for each question.</p><p id="progress" aria-live="polite"></p><form id="quiz"></form><div class="actions"><button type="button" id="grade">Submit &amp; Grade Quiz</button><button type="button" id="retake" class="secondary">Retake Quiz</button><button type="button" id="print" class="secondary" hidden>Print Results</button></div><p id="notice" role="alert"></p><div id="result" role="status" aria-live="polite"></div></main><script>
const Q=[{"question": "Which Illustrator panel lists the objects and groups in a document?", "options": ["Swatches", "Appearance", "Character", "Layers"], "answer": 3}, {"question": "Where can you reopen a hidden Illustrator panel?", "options": ["Window menu", "File menu", "Select menu", "Object menu"], "answer": 0}, {"question": "What is an artboard?", "options": ["A raster image layer", "A printable/exportable design area", "A locked vector group", "A color swatch collection"], "answer": 1}, {"question": "Which tool selects an entire object?", "options": ["Pen Tool", "Type Tool", "Selection Tool", "Direct Selection Tool"], "answer": 2}, {"question": "Which tool edits individual anchor points?", "options": ["Selection Tool", "Artboard Tool", "Hand Tool", "Direct Selection Tool"], "answer": 3}, {"question": "What does vector artwork primarily use?", "options": ["Paths and anchor points", "Fixed pixel grids", "Photographic grain", "Image compression"], "answer": 0}, {"question": "Which tool moves your view without moving artwork?", "options": ["Rotate Tool", "Hand Tool", "Selection Tool", "Shape Builder Tool"], "answer": 1}, {"question": "Which tool changes the magnification of your view?", "options": ["Free Transform Tool", "Width Tool", "Zoom Tool", "Scale Tool"], "answer": 2}, {"question": "Which file format keeps Illustrator artwork editable?", "options": ["JPG", "PNG", "GIF", "AI"], "answer": 3}, {"question": "Which shortcut commonly undoes the last action on Windows?", "options": ["Ctrl+Z", "Ctrl+S", "Ctrl+P", "Ctrl+G"], "answer": 0}, {"question": "What is the purpose of the Properties panel?", "options": ["Display printer status", "Show context-sensitive object settings", "Store deleted artwork", "List installed fonts only"], "answer": 1}, {"question": "What happens when you lock a layer?", "options": ["Its colors become grayscale", "It automatically exports", "Its contents cannot be selected or edited normally", "Its contents are permanently deleted"], "answer": 2}, {"question": "What does the bounding box help you do?", "options": ["Paint pixel details", "Edit paragraph spelling", "Manage printer ink", "Resize and transform selected artwork"], "answer": 3}, {"question": "What distinguishes the Selection Tool from Direct Selection?", "options": ["Whole objects versus points/segments", "RGB versus CMYK", "Saving versus exporting", "Painting versus erasing"], "answer": 0}, {"question": "What does the workspace feature control?", "options": ["Vector stroke width", "Arrangement of panels and tools", "Artwork physical size", "Document color profile only"], "answer": 1}];
const form=document.getElementById('quiz');const progress=document.getElementById('progress');const result=document.getElementById('result');const notice=document.getElementById('notice');
function build(){form.replaceChildren();Q.forEach((x,i)=>{const fs=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent=(i+1)+'. '+x.question;fs.append(legend);x.options.forEach((o,k)=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=String(k);input.addEventListener('change',update);label.append(input,document.createTextNode(' '+String.fromCharCode(65+k)+'. '+o));fs.append(label)});form.append(fs)});update()}
function update(){let n=0;Q.forEach((_,i)=>{if(form.querySelector('input[name="q'+i+'"]:checked'))n++});progress.textContent=n+' of '+Q.length+' answered';notice.textContent=''}
function grade(){const missing=[];Q.forEach((_,i)=>{if(!form.querySelector('input[name="q'+i+'"]:checked'))missing.push(i+1)});if(missing.length){notice.textContent='Please answer question'+(missing.length===1?' ':'s ')+missing.join(', ')+' before submitting.';form.children[missing[0]-1].scrollIntoView({behavior:'smooth',block:'center'});return}let score=0;Q.forEach((x,i)=>{const fs=form.children[i];const chosen=fs.querySelector('input:checked');const val=Number(chosen.value);if(val===x.answer)score++;fs.querySelectorAll('label').forEach((label,k)=>{label.classList.toggle('good',k===x.answer);label.classList.toggle('bad',k===val&&val!==x.answer)});fs.querySelectorAll('input').forEach(input=>input.disabled=true)});result.textContent='Your score: '+score+' / '+Q.length+' ('+Math.round(score/Q.length*100)+'%). Green = correct answer; red = incorrect selection.';notice.textContent='';document.getElementById('grade').hidden=true;document.getElementById('print').hidden=false;result.scrollIntoView({behavior:'smooth',block:'center'})}
function retake(){build();result.textContent='';document.getElementById('grade').hidden=false;document.getElementById('print').hidden=true;window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('grade').addEventListener('click',grade);document.getElementById('retake').addEventListener('click',retake);document.getElementById('print').addEventListener('click',()=>window.print());build();
</script></body></html>
